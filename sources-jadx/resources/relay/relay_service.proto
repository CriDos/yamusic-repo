syntax = "proto3";

package relay;

import "relay/relay_state.proto";
import "relay/relay_queue.proto";
import "relay/playback_request.proto";
import "google/protobuf/empty.proto";

option java_package = "com.yandex.music.shared.relay.common.proto";
option java_multiple_files = true;

service RelayGrpcService {
  rpc Version(VersionProto) returns (VersionProto);

  // Check if user is authorized and return user ID
  rpc CheckAuthorization(google.protobuf.Empty) returns (AuthorizationResponse);

  // Stream queue and player state updates
  rpc StreamStateUpdates(google.protobuf.Empty) returns (stream RelayStateUpdateProto);

  // Invoke a command
  rpc InvokeCommand(InvokeCommandRequest) returns (google.protobuf.Empty);
}

message VersionProto {
  // Version of current server/client
  uint32 version = 1;

  // UUID for current session (generated by client)
  optional string uuid = 2;
}

message AuthorizationResponse {
  // Whether the user is authorized
  bool authorized = 1;

  // User ID
  optional string user_id = 2;
}

message InvokeCommandRequest {
  oneof command {
    ChangePlayingStatus playing_command = 1;
    SeekTo seek_command = 2;
    google.protobuf.Empty skip_command = 3;
    PrevCommand prev_command = 4;
    SetPosition position_command = 5;
    SetRepeatMode repeat_command = 6;
    SetShuffle shuffle_command = 7;
    RemotePlaybackRequestProto request_playback_command = 8;
    google.protobuf.Empty perform_sync_command = 9;
    google.protobuf.Empty await_queue = 10;
  }
}

message ChangePlayingStatus {
  bool playing = 1;
}

message SeekTo {
  uint64 position = 1;
}

message PrevCommand {
  bool force = 1;
}

message SetPosition {
  uint32 position = 1;
}

message SetRepeatMode {
  RepeatModeProto repeat_mode = 1;
}

message SetShuffle {
  bool shuffle = 1;
}
